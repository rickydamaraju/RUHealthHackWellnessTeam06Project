name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm run check
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
      - run: npm run build
      - run: npm run synth -- --quiet >/dev/null
      - run: docker build backend --tag glucose-compass-backend:ci
